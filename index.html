<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>캠페인 월별 캘린더</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="hero">
      <div>
        <p class="eyebrow">Google Sheets CSV → Campaign Calendar</p>
        <h1>캠페인 기간을 월별 캘린더로 한눈에 보기</h1>
        <p class="hero__copy">
          공개 CSV의 <strong>캠페인명</strong>과 기간 정보를 읽어 월별 달력에 자동으로 배치합니다.
        </p>
      </div>
      <div class="hero__stats" aria-live="polite">
        <span id="campaignCount">0</span>
        <small>표시 중인 캠페인</small>
      </div>
    </header>

    <main>
      <section class="panel controls" aria-label="캘린더 설정">
        <label class="url-field">
          <span>CSV 주소</span>
          <input id="csvUrl" type="url" autocomplete="off" />
        </label>
        <div class="control-row">
          <button id="loadCsv" type="button">CSV 불러오기</button>
          <label class="file-button">
            CSV 파일 선택
            <input id="csvFile" type="file" accept=".csv,text/csv" />
          </label>
          <label class="search-field">
            <span>검색</span>
            <input id="search" type="search" placeholder="캠페인명 검색" />
          </label>
        </div>
        <details class="help">
          <summary>인식 가능한 컬럼명</summary>
          <p>
            캠페인명 컬럼은 <code>캠페인명</code>, <code>Campaign Name</code>, <code>name</code> 등을 찾습니다.
            기간은 <code>시작일</code>/<code>종료일</code> 조합 또는 <code>캠페인 기간</code>, <code>기간</code>처럼
            한 컬럼에 <code>2026.05.01 ~ 2026.05.15</code> 형태로 적힌 값을 모두 지원합니다.
          </p>
        </details>
      </section>

      <section id="status" class="status" role="status" aria-live="polite"></section>
      <section id="calendar" class="calendar" aria-label="월별 캠페인 캘린더"></section>
    </main>

    <template id="monthTemplate">
      <article class="month-card">
        <div class="month-card__header">
          <h2></h2>
          <span></span>
        </div>
        <div class="weekday-grid" aria-hidden="true">
          <b>일</b><b>월</b><b>화</b><b>수</b><b>목</b><b>금</b><b>토</b>
        </div>
        <div class="day-grid"></div>
      </article>
    </template>

    <script src="app.js" defer></script>
  </body>
</html>
